name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Release signing is optional. Add these repository secrets to get a signed release APK:
      #   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME), so no separate
      # setup action is needed. We only accept licenses and make sure platform 36 is present.
      - name: Install Android SDK platform and build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Restore release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK (only when signing is configured)
        if: env.KEYSTORE_B64 != ''
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AdvancedCallRecorder-debug.apk || echo "No debug APK was produced"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AdvancedCallRecorder-release.apk
          else
            echo "Release APK not built (signing secrets not configured, or the release build failed)."
          fi
          # Source ZIP: every tracked file (including adb/ and .github/), no build caches or untracked junk.
          git archive --format=zip --prefix=AdvancedCallRecorder/ -o dist/AdvancedCallRecorder-Source.zip HEAD
          ls -la dist

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedCallRecorder-debug-apk
          path: dist/AdvancedCallRecorder-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedCallRecorder-release-apk
          path: dist/AdvancedCallRecorder-release.apk
          if-no-files-found: ignore

      - name: Upload source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedCallRecorder-Source
          path: dist/AdvancedCallRecorder-Source.zip
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
